name: smart-search

services:
  postgres:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: smart_search
      POSTGRES_USER: smart_search
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_search_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 2
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_search -d smart_search"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
