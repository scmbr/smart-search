name: smart-search

services:
  postgres:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: smart_search
      POSTGRES_USER: smart_search
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_search_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 1g
    cpus: 2
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_search -d smart_search"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.7
    profiles: [search]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      xpack.license.self_generated.type: basic
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD-SHELL, "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 30s

volumes:
  postgres-data:
  elasticsearch-data:
